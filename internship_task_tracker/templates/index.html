<!DOCTYPE html>
<html>

<head>

    <title>Internship Task Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->

    <div class="sidebar">

        <h2>Task Tracker</h2>

        <button onclick="showPage('dashboard')">
            Dashboard
        </button>

        <button onclick="showPage('interns')">
            Interns
        </button>

        <button onclick="showPage('addIntern')">
            Add Intern
        </button>

        <button onclick="showPage('tasks')">
            All Tasks
        </button>

        <button onclick="showPage('addTask')">
            Assign Task
        </button>

        <button onclick="showPage('progress')">
            Progress Report
        </button>

    </div>


    <!-- RIGHT SIDE -->

    <div class="main">

        <h1>Internship Task Tracker</h1>


        <!-- DASHBOARD -->

        <div id="dashboard" class="page">

            <h2>Dashboard</h2>

            <div class="boxes">

                <div class="box">
                    <h3>Total Tasks</h3>
                    <p id="totalTasks">0</p>
                </div>

                <div class="box">
                    <h3>Completed</h3>
                    <p id="completedTasks">0</p>
                </div>

                <div class="box">
                    <h3>Pending</h3>
                    <p id="pendingTasks">0</p>
                </div>

                <div class="box">
                    <h3>Overdue</h3>
                    <p id="overdueTasks">0</p>
                </div>

            </div>

        </div>


        <!-- INTERNS -->

        <div id="interns" class="page">

            <h2>Interns</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Joining Date</th>
                    </tr>

                </thead>

                <tbody id="internTable">

                </tbody>

            </table>

        </div>


        <!-- ADD INTERN -->

        <div id="addIntern" class="page">

            <h2>Add Intern</h2>

            <form id="internForm">

                <label>Name</label>

                <input type="text"
                       id="internName"
                       placeholder="Enter name"
                       required>


                <label>Email</label>

                <input type="email"
                       id="internEmail"
                       placeholder="Enter email"
                       required>


                <label>Department</label>

                <input type="text"
                       id="department"
                       placeholder="Enter department"
                       required>


                <label>Joining Date</label>

                <input type="date"
                       id="joiningDate"
                       required>


                <button type="submit">
                    Add Intern
                </button>

            </form>

        </div>


        <!-- ALL TASKS -->

        <div id="tasks" class="page">

            <h2>All Tasks</h2>

            <div id="taskList"></div>

        </div>


        <!-- ASSIGN TASK -->

        <div id="addTask" class="page">

            <h2>Assign Task</h2>

            <form id="taskForm">


                <!-- TASK TYPE FIRST -->

                <label>Task Type</label>

                <select id="taskType"
                        onchange="changeTaskType()"
                        required>

                    <option value="">
                        Select Task Type
                    </option>

                    <option value="Individual">
                        Individual Task
                    </option>

                    <option value="Team">
                        Team Task
                    </option>

                </select>


                <!-- INDIVIDUAL INTERN -->

                <div id="individualBox">

                    <label>Select Intern</label>

                    <select id="taskIntern">

                        <option value="">
                            Select Intern
                        </option>

                    </select>

                </div>


                <!-- TEAM INTERNS -->

                <div id="teamBox">

                    <label>Select Team Members</label>

                    <div id="teamMembers">

                    </div>

                    <p class="small-text">
                        Select one or more interns
                    </p>

                </div>


                <label>Task Title</label>

                <input type="text"
                       id="taskTitle"
                       placeholder="Enter task title"
                       required>


                <label>Description</label>

                <textarea id="taskDescription"
                          placeholder="Enter task description"
                          required></textarea>


                <label>Deadline</label>

                <input type="date"
                       id="deadline"
                       required>


                <button type="submit">
                    Assign Task
                </button>

            </form>

        </div>


        <!-- PROGRESS -->

        <div id="progress" class="page">

            <h2>Progress Report</h2>

            <div id="progressReport"></div>

        </div>

    </div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
