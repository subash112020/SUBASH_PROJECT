<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · IMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
<div class="login-shell">
  <div class="card login-card">
    <div class="card-body p-4 p-lg-5">
      <div class="login-brand-text">Internship Management System</div>
      <h1 class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to continue to your workspace.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} auto-dismiss-alert" role="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" class="login-form">
        <label class="form-label login-label">Login as</label>
        <div class="login-role-group mb-4">
          <label><input type="radio" name="role" value="admin" required><span><i class="bi bi-shield-lock"></i> Admin</span></label>
          <label><input type="radio" name="role" value="mentor"><span><i class="bi bi-person-workspace"></i> Mentor</span></label>
          <label><input type="radio" name="role" value="intern"><span><i class="bi bi-person"></i> Intern</span></label>
        </div>

        <div class="mb-4">
          <label class="form-label login-label">Username or email</label>
          <input class="form-control form-control-lg login-input" name="username_or_email"
                 placeholder="Enter your username or email" autocomplete="username" required>
        </div>

        <div class="mb-4">
          <label class="form-label login-label">Password</label>
          <div class="password-wrap">
            <input id="loginPassword" class="form-control form-control-lg login-input" type="password"
                   name="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button class="btn btn-primary btn-lg w-100 login-button" type="submit">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>

      <div class="login-help mt-4">Use the username or email address created by your administrator.</div>
    </div>
  </div>
</div>
<script>
function togglePassword(id, button) {
  const input = document.getElementById(id);
  const icon = button.querySelector("i");
  if (input.type === "password") {
    input.type = "text"; icon.className = "bi bi-eye-slash";
    button.setAttribute("aria-label", "Hide password");
  } else {
    input.type = "password"; icon.className = "bi bi-eye";
    button.setAttribute("aria-label", "Show password");
  }
}
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".auto-dismiss-alert").forEach((alert) => {
    setTimeout(() => alert.remove(), 3000);
  });
});
</script>
</body></html>
